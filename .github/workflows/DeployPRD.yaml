name: Publish API

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Publish via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: 22        
        script: |
            export MYSQL_ROOT_PASSWORD='${{ secrets.DB_ROOT_PASSWORD }}'
            export MYSQL_DATABASE=hablemos_espanhol
            export MYSQL_USER='${{ secrets.DB_USER }}'
            export MYSQL_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_PORT='${{ secrets.DB_PORT }}'
            export DB_USER='${{ secrets.DB_USER }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_NAME=hablemos_espanhol
            export PORT='${{ secrets.PORT }}'
            export REPO_FOLDER='${{ github.event.repository.name }}'
            export GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}'
            export AUTH_API_URL='${{ secrets.AUTH_API_URL }}'

            cd apps

            echo 'Delete previous repository data'
            rm -rf $REPO_FOLDER

            echo 'Cloning repository ${{ github.repository }}'
            git clone git@github.com:${{ github.repository }}.git
            cd $REPO_FOLDER
            
            echo 'Update data...'
            git pull
            git status

            sleep 5
            echo ''
            echo 'Publish on Docker and restart'
            docker compose up --build -d

            echo ''
            echo 'Sucessfully Published!'
            
    - name: Validando Container via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        command_timeout: 10m
        script: |
          echo "🔍 Validando se o container está OK..."
          CONTAINER_NAME="hablemos-espanhol-backend-hablemos-espanhol-backend-1"
          
          MAX_ATTEMPTS=3
          SLEEP_TIME=30
          OUTPUT=""
          i=1

          while [ $i -le $MAX_ATTEMPTS ]; do
            echo "📋 Tentativa $i de $MAX_ATTEMPTS..."
            
            OUTPUT=$(docker logs --tail 100 "$CONTAINER_NAME" 2>&1 || true)

            # Remove espaços e quebras de linha para checar se há conteúdo real
            CLEAN_OUTPUT=$(echo "$OUTPUT" | tr -d '[:space:]')

            if [ -n "$CLEAN_OUTPUT" ]; then
              echo "✅ Logs coletados com sucesso!"
              break
            fi

            echo "⚠️ Nenhum dado retornado nos logs."
            
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Aguardando ${SLEEP_TIME}s antes da próxima tentativa..."
              sleep $SLEEP_TIME
            fi

            i=$((i + 1))
          done

          echo "===== LOGS DO CONTAINER ====="
          echo "$OUTPUT"
          echo "============================="

          CLEAN_OUTPUT=$(echo "$OUTPUT" | tr -d '[:space:]')

          if [ -z "$CLEAN_OUTPUT" ]; then
            echo "❌ ERRO: O container não gerou nenhum log após $MAX_ATTEMPTS tentativas."
            exit 1
          fi

          if echo "$OUTPUT" | grep -q "ERROR"; then
            echo "❌ Encontrado 'ERROR' nos logs do container!"
            exit 1
          else
            echo "✅ Nenhum 'ERROR' encontrado nos logs."
          fi
